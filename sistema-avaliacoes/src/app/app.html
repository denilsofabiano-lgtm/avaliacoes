<div class="main-container">
  <mat-toolbar color="primary">
    <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isLoggedIn">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Sistema de Avaliações</span>
    <span class="spacer"></span>
    <div *ngIf="isLoggedIn">
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>person</mat-icon>
        {{ currentUser?.nome }}
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          Sair
        </button>
      </mat-menu>
    </div>
  </mat-toolbar>

  <mat-sidenav-container class="content-area" *ngIf="isLoggedIn">
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        
        <mat-divider></mat-divider>
        
        <div mat-subheader>Gestão</div>
        <a mat-list-item routerLink="/usuarios" routerLinkActive="active-link" *ngIf="isAdmin">
          <mat-icon matListItemIcon>people</mat-icon>
          <span matListItemTitle>Usuários</span>
        </a>
        
        <a mat-list-item routerLink="/avaliacoes" routerLinkActive="active-link" *ngIf="isProfessor || isAdmin">
          <mat-icon matListItemIcon>assignment</mat-icon>
          <span matListItemTitle>Avaliações</span>
        </a>
        
        <a mat-list-item routerLink="/questoes" routerLinkActive="active-link" *ngIf="isProfessor || isAdmin">
          <mat-icon matListItemIcon>quiz</mat-icon>
          <span matListItemTitle>Questões</span>
        </a>
        
        <mat-divider></mat-divider>
        
        <div mat-subheader>Aplicação</div>
        <a mat-list-item routerLink="/aplicacoes" routerLinkActive="active-link">
          <mat-icon matListItemIcon>play_circle_filled</mat-icon>
          <span matListItemTitle>Aplicações</span>
        </a>
        
        <a mat-list-item routerLink="/relatorios" routerLinkActive="active-link" *ngIf="isProfessor || isAdmin">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Relatórios</span>
        </a>
        
        <mat-divider></mat-divider>
        
        <a mat-list-item routerLink="/configuracoes" routerLinkActive="active-link" *ngIf="isAdmin">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Configurações</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <div class="content-area" *ngIf="!isLoggedIn">
    <router-outlet></router-outlet>
  </div>
</div>
