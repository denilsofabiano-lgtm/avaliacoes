version: '3.8'

services:
  # Frontend Angular Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-avaliacoes-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - avaliacoes-network
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API Symfony
  backend:
    build:
      context: ../sistema-avaliacoes-api
      dockerfile: Dockerfile
      target: php
    container_name: sistema-avaliacoes-backend
    restart: unless-stopped
    networks:
      - avaliacoes-network
    environment:
      - APP_ENV=prod
      - DATABASE_URL=postgresql://avaliacoes_user:avaliacoes_password@database:5432/sistema_avaliacoes?serverVersion=15&charset=utf8
      - JWT_PASSPHRASE=your-jwt-passphrase
      - CORS_ALLOW_ORIGIN=http://localhost:8080
    volumes:
      - ../sistema-avaliacoes-api:/var/www/html
    depends_on:
      - database
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx for Backend
  nginx-api:
    build:
      context: ../sistema-avaliacoes-api
      dockerfile: Dockerfile
      target: web
    container_name: sistema-avaliacoes-nginx
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - avaliacoes-network
    depends_on:
      - backend
    volumes:
      - ../sistema-avaliacoes-api/public:/usr/share/nginx/html

  # Database (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: sistema-avaliacoes-db
    environment:
      POSTGRES_DB: sistema_avaliacoes
      POSTGRES_USER: avaliacoes_user
      POSTGRES_PASSWORD: avaliacoes_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - avaliacoes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avaliacoes_user -d sistema_avaliacoes"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis (Para cache e sessões)
  redis:
    image: redis:7-alpine
    container_name: sistema-avaliacoes-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - avaliacoes-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer (Database Management)
  adminer:
    image: adminer:latest
    container_name: sistema-avaliacoes-adminer
    ports:
      - "8082:8080"
    restart: unless-stopped
    networks:
      - avaliacoes-network
    depends_on:
      - database
    environment:
      ADMINER_DEFAULT_SERVER: database

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  avaliacoes-network:
    driver: bridge
