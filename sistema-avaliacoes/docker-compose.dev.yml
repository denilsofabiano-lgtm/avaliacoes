version: '3.8'

services:
  # Frontend Angular Application (Development)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sistema-avaliacoes-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - avaliacoes-dev-network
    environment:
      - NODE_ENV=development
    command: npm run start

  # Database para desenvolvimento
  database-dev:
    image: postgres:15-alpine
    container_name: sistema-avaliacoes-db-dev
    environment:
      POSTGRES_DB: sistema_avaliacoes_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - avaliacoes-dev-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  avaliacoes-dev-network:
    driver: bridge
