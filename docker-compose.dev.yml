version: '3.8'

services:
  # Frontend Angular Development
  frontend:
    build:
      context: .
      dockerfile: docker/development/frontend.Dockerfile
    container_name: avaliacoes-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - ./sistema-avaliacoes:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - avaliacoes-network
    restart: unless-stopped

  # Backend Symfony Development
  backend:
    build:
      context: .
      dockerfile: docker/development/backend.Dockerfile
    container_name: avaliacoes-backend-dev
    ports:
      - "8081:8081"
    volumes:
      - ./sistema-avaliacoes-api:/var/www/html
      - backend-data:/var/www/html/var
    environment:
      - APP_ENV=dev
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db
      - JWT_PASSPHRASE=avaliacoes2024
    networks:
      - avaliacoes-network
    restart: unless-stopped

  # Database (PostgreSQL for development)
  database:
    image: postgres:15-alpine
    container_name: avaliacoes-db-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=sistema_avaliacoes
      - POSTGRES_USER=avaliacoes_user
      - POSTGRES_PASSWORD=avaliacoes_password
    networks:
      - avaliacoes-network
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: avaliacoes-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - avaliacoes-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  backend-data:
    driver: local

networks:
  avaliacoes-network:
    driver: bridge
